<div class="hero-video overflow-hidden">
  <!-- The poster is likely the page's largest paint. It was a 3.4 MB PNG screenshot with a
       transparent shadow margin; this is an opaque 16:9 crop of it at the video's size, 47 KB. -->
  <video #videoPlayer [muted]="true" autoplay loop playsinline [ngClass]="isVideoLgReady ? 'd-none' : ''"
    [src]="videoLink" poster="/assets/video/about-practitioner-poster-1280x720.v1.jpg"></video>
  <video #videoLg playinline [muted]="true" [ngClass]="!isVideoLgReady ? 'd-none' : ''" preload="none"
    [src]="videoLinkLg"></video>
</div>

<section class="container mt-100p mb-50p">
  <ul class="row list-unstyled justify-content-center">
    <li *ngFor="let feature of features" class="mb-50p col-12 col-md-6 col-xl-4">
      <div class="mb-25p">
        <i [iconPh]="feature.icon" style="font-size: 30px"></i>
      </div>
      <h4 class="h4-md">{{ feature.title }}</h4>
      <p class="text-label">{{ feature.content }}</p>
    </li>
  </ul>
</section>

<!-- Basic, Pro and Growth, the same section as /for-practitioners
(Hedieh's offer v2, section 2). -->
<plan-choice source="plans" sectionClass="bg-lightgreen"></plan-choice>

<section class="container my-100p position-relative">
  <span id="faq" style="top: -100px; position: absolute"></span>
  <div class="row justify-content-center">
    <div class="col-12 col-xl-10">
      <h2 class="h3 h2-md mb-50p text-center">Frequently Asked Questions</h2>
      <ul class="list-unstyled mb-0">
        <li *ngFor="let faq of faqs" class="mb-20p">
          <faq-item [data]="faq"></faq-item>
        </li>
      </ul>
    </div>
  </div>
</section>
