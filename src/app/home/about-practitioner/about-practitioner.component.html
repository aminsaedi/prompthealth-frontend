<div class="hero-video overflow-hidden">
  <!-- The poster is likely the page's largest paint. It was a 3.4 MB PNG screenshot with a
       transparent shadow margin; this is an opaque 16:9 crop of it at the video's size, 47 KB. -->
  <video #videoPlayer [muted]="true" autoplay loop playsinline [ngClass]="isVideoLgReady ? 'd-none' : ''"
    [src]="videoLink" poster="/assets/video/about-practitioner-poster-1280x720.v1.jpg"></video>
  <video #videoLg playinline [muted]="true" [ngClass]="!isVideoLgReady ? 'd-none' : ''" preload="none"
    [src]="videoLinkLg"></video>
</div>

<section class="container mt-100p mb-50p">
  <ul class="row list-unstyled justify-content-center">
    <li *ngFor="let feature of features" class="mb-50p col-12 col-md-6 col-xl-4">
      <div class="mb-25p">
        <i [iconPh]="feature.icon" style="font-size: 30px"></i>
      </div>
      <h4 class="h4-md">{{ feature.title }}</h4>
      <p class="text-label">{{ feature.content }}</p>
    </li>
  </ul>
</section>

<section class="container my-100p">
  <h2 class="h3 h2-md text-center mb-60p">Plans for Practitioners</h2>
  <div class="row justify-content-center">

    <!-- Free Profile -->
    <div class="col-12 col-lg-5 mb-20p mb-lg-0p mr-lg-20p">
      <div class="card h-100 p-30p d-flex flex-column">
        <div class="mb-20p">
          <i iconPh="gift-outline" style="font-size: 42px" class="text-primary"></i>
        </div>
        <h3 class="h4 h3-md mb-10p">Free Profile</h3>
        <p class="text-label mb-25p">Create your presence on PromptHealth and be discoverable.</p>
        <ul class="list-unstyled pl-25p plan-features flex-grow-1">
          <li *ngFor="let item of freePlanFeatures" class="position-relative mb-15p subtitle2">
            <i class="icon-pre text-placeholder" iconPh="checkbox-square-outline"></i>
            <span>{{ item }}</span>
          </li>
        </ul>
        <button class="btn btn-primary-dark mt-30p w-100" (click)="onClickCreateFreeProfile()">
          Create Free Profile
        </button>
      </div>
    </div>

    <!-- PromptHealth Growth -->
    <div class="col-12 col-lg-5 mb-20p mb-lg-0p">
      <growth-plan-card icon="video-camera"></growth-plan-card>
    </div>

  </div>
</section>

<section class="container my-100p position-relative">
  <span id="faq" style="top: -100px; position: absolute"></span>
  <div class="row justify-content-center">
    <div class="col-12 col-xl-10">
      <h2 class="h3 h2-md mb-50p text-center">Frequently Asked Questions</h2>
      <ul class="list-unstyled mb-0">
        <li *ngFor="let faq of faqs" class="mb-20p">
          <faq-item [data]="faq"></faq-item>
        </li>
      </ul>
    </div>
  </div>
</section>
