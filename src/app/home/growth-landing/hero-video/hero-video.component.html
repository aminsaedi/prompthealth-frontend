<div class="hero-video" [class.hero-video--portrait]="portrait" [style.padding-top.%]="ratio">
  <video
  #player
  class="hero-video__player"
  playsinline
  [controls]="started"
  preload="none"
  [attr.width]="video.width"
  [attr.height]="video.height"
  [poster]="video.poster"
  (loadedmetadata)="onLoadedMetadata()"
  (play)="onPlay()"
  >
    <source [src]="video.src" type="video/mp4">
    <track kind="captions" srclang="en" label="English" [src]="video.captions" [attr.default]="video.captionsBurnedIn ? null : ''">
  </video>
  <button
  *ngIf="!started"
  type="button"
  class="hero-video__overlay"
  [attr.aria-label]="'Play video: ' + video.title"
  (click)="start()"
  >
    <span class="hero-video__glyph" aria-hidden="true"></span>
  </button>
</div>
