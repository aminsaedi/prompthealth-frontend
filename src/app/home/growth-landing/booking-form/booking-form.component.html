<div class="booking-form">
  <h2 #heading id="booking-form-heading" class="h4 mb-10p pr-40p booking-form__heading" tabindex="-1">{{ booking.formHeading }}</h2>

  <form *ngIf="step === 'form'" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <p class="text-label mb-20p booking-form__description">{{ booking.description }}</p>

    <div class="booking-form__fields">
      <div *ngFor="let field of fields" class="booking-form__field mb-15p" [class.booking-form__field--half]="field.half">
        <label class="subtitle2 text-body mb-5p d-block" [attr.for]="'booking-' + field.name">
          {{ booking.labels[field.name] }}
          <span *ngIf="field.optional" class="booking-form__optional">{{ booking.optionalLabel }}</span>
        </label>
        <input
        class="form-control"
        [type]="field.type"
        [id]="'booking-' + field.name"
        [formControlName]="field.name"
        [attr.autocomplete]="field.autocomplete"
        [attr.maxlength]="field.max"
        [attr.inputmode]="field.type === 'email' ? 'email' : (field.type === 'tel' ? 'tel' : null)"
        [attr.autocapitalize]="field.type === 'email' ? 'off' : null"
        [attr.aria-required]="field.optional ? null : 'true'"
        [attr.aria-invalid]="showError(field.name) ? 'true' : null"
        [attr.aria-describedby]="showError(field.name) ? 'booking-' + field.name + '-error' : null"
        >
        <p
        *ngIf="showError(field.name)"
        class="booking-form__field-error mt-5p mb-0"
        [id]="'booking-' + field.name + '-error'"
        >{{ booking.validation[field.name] }}</p>
      </div>
    </div>

    <!-- Off-screen, not type="hidden", which a bot knows to skip. Out of the tab
    order and the accessibility tree, and named so that no password manager or
    Safari AutoFill mistakes it for a website or address field. -->
    <div class="booking-form__hp" aria-hidden="true">
      <input type="text" id="booking-hp-extra" name="hp_extra" formControlName="hp_extra" autocomplete="off" tabindex="-1">
    </div>

    <button type="submit" class="btn btn-primary booking-form__submit mt-10p" [disabled]="isSending">{{ booking.submit }}</button>
    <p *ngIf="errorMessage" class="booking-form__alert mt-15p mb-0" role="alert">{{ errorMessage }}</p>
    <!-- A new tab, so reading the policy does not cost what was typed. -->
    <p class="booking-form__privacy text-label mt-15p mb-0">{{ booking.privacy.before }}<a [routerLink]="booking.privacy.path" target="_blank" rel="noopener">{{ booking.privacy.link }}</a>{{ booking.privacy.after }}</p>
  </form>

  <p *ngIf="step === 'thanks'" class="subtitle1 mb-0" role="status">{{ booking.thanks }}</p>
</div>
