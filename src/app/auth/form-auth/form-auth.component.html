<section>
  <form [formGroup]="form" (ngSubmit)="signinEmail()">
    <div *ngIf="authType == 'signup' && !isProviderSignup" class="mb-3">
      <label class="subtitle2">You are...</label>
      <form-item-input name="type" type="text" [disabled]="true" [controller]="formRole"></form-item-input>
      <!-- A practitioner on the patient form is the mistake Hedieh's brief of
      2026-10-22 (step 6) is about: patient accounts are not listed. -->
      <p *ngIf="userRole == 'U'" class="body2 text-label mt-1 mb-0">
        A practitioner or clinic? <a routerLink="/auth/registration/sp" [queryParams]="nextQuery">Create a professional account</a> instead.
      </p>
    </div>

    <!-- Practitioner or clinic, chosen here rather than by which link brought
    the visitor: both used to read "Wellness Provider", and clinics signed up
    as practitioners. -->
    <fieldset *ngIf="isProviderSignup" class="mb-3">
      <legend class="subtitle2 mb-2">You are signing up as</legend>
      <div class="role-choice" role="radiogroup">
        <button type="button" class="role-choice__option" role="radio"
          [attr.aria-checked]="userRole == 'SP'" [class.is-active]="userRole == 'SP'"
          (click)="chooseProviderRole('SP')">A practitioner</button>
        <button type="button" class="role-choice__option" role="radio"
          [attr.aria-checked]="userRole == 'C'" [class.is-active]="userRole == 'C'"
          (click)="chooseProviderRole('C')">A clinic</button>
      </div>
    </fieldset>

    <div *ngIf="isProviderSignup && typeOptions.length" class="mb-3">
      <label class="subtitle2" for="typeOfProvider">
        {{ userRole == 'C' ? 'Type of practice' : 'Practitioner type' }} <span class="text-danger">*</span>
      </label>
      <select id="typeOfProvider" class="form-control type-select" formControlName="typeOfProvider"
        [class.is-invalid]="isSubmitted && f.typeOfProvider.invalid"
        [attr.aria-invalid]="isSubmitted && f.typeOfProvider.invalid ? 'true' : null">
        <option value="" disabled>Choose one</option>
        <option *ngFor="let option of typeOptions" [value]="option.id">{{ option.label }}</option>
      </select>
      <form-item-errors [controller]="f.typeOfProvider" [label]="userRole == 'C' ? 'Type of practice' : 'Practitioner type'" [submitted]="isSubmitted"></form-item-errors>
    </div>
    <div class="mb-3">
      <label class="subtitle2">Email Address <span class="text-danger">*</span></label>
      <form-item-input name="email" type="email" label="Email Address" placeholder="Enter your email"
        autocomplete="email" autocapitalize="off" [submitted]="isSubmitted" [controller]="f.email"></form-item-input>
    </div>

    <div class="mb-3">
      <label class="subtitle2">Password <span class="text-danger">*</span></label>
      <form-item-input name="password" label="Password" type="password" placeholder="Enter your password"
        [autocomplete]="(authType == 'signin') ? 'current-password' : 'new-password'" [submitted]="isSubmitted"
        [controller]="f.password"></form-item-input>
    </div>

    <div class="mb-3" *ngIf="authType == 'signup'">
      <label class="subtitle2">Confirm Password <span class="text-danger">*</span></label>
      <form-item-input name="confirmPassword" label="Password" type="password" placeholder="Confirm your password"
        autocomplete="new-password" [submitted]="isSubmitted" [controller]="f.confirm_password"></form-item-input>
    </div>

    <div class="mb-3" *ngIf="authType == 'signup'">
      <label class="subtitle2">
        How did you hear about us?
        <!-- <span class="text-danger">*</span> -->
      </label>
      <form-item-input name="hear_from" label="Message" placeholder="Enter your message" [submitted]="isSubmitted"
        [controller]="f.hear_from"></form-item-input>
    </div>

    <div class="mb-3" *ngIf="authType == 'signup'">
      <form-item-checkbox
        label="I agree to the <a href='/terms' target='_blank'>terms of service</a> and <a href='/terms' target='_blank'>privacy policy</a>"
        [controller]="f.t_c"></form-item-checkbox>
      <form-item-errors [controller]="f.t_c" label="Agreement" [submitted]="isSubmitted"></form-item-errors>
    </div>

    <div class="mb-2">
      <input class="btn btn-primary w-100" type="submit" [disabled]="isLoading"
        [value]="(authType == 'signin') ? 'Sign In' : 'Sign Up'">
    </div>

    <div class="text-right mb-3" *ngIf="authType == 'signin'">
      <a [routerLink]="['/auth/forgot-password']" class="btn btn-text-black small pr-0">Forgot Password?</a>
    </div>

    <div *ngIf="authType == 'signin'">
      <hr>
      <a [routerLink]="[registrationLink]" [queryParams]="nextQuery" class="btn btn-text small w-100">Create Account</a>
      <div class="body2 text-center">Or</div>
      <a routerLink="/plans" class="btn btn-text small w-100">Get featured now on PromptHealth</a>
    </div>

    <div *ngIf="authType == 'signup'">
      <hr>
      <a [routerLink]="['/auth/login']" [queryParams]="nextQuery" class="btn btn-text small w-100">Have an account? Login</a>
    </div>
  </form>
</section>
