<div class="bg-white py-50p px-15p px-lg-30p rounded-8p">
  <ng-container *ngIf="user.isU">
    <form-client-general
    [data]="user.decode()"
    [disabled]="isUploading" 
    (submitForm)="onSubmit($event)"
    ></form-client-general>
  </ng-container>

  <ng-container *ngIf="user.isSP">
    <form-provider-general
    [data]="user.decode()"
    [disabled]="isUploading" 
    (submitForm)="onSubmit($event)"
    ></form-provider-general>
  </ng-container>

  <ng-container *ngIf="user.isC">
    <form-centre-general
    [data]="user.decode()"
    [disabled]="isUploading" 
    (submitForm)="onSubmit($event)"
    ></form-centre-general>
  </ng-container>


  <ng-container *ngIf="user.isP">
    <form-partner-general
    [data]="user.decode()"
    [disabled]="isUploading" 
    (submitForm)="onSubmit($event)"
    ></form-partner-general>
  </ng-container>

  <ng-container *ngIf="user.isSA">
    <form-provider-general
    [data]="user.decode()"
    [disabled]="isUploading" 
    (submitForm)="onSubmit($event)"
    ></form-provider-general>
    <form-admin-general
    [data]="user.decode()"
    [disabled]="isUploading" 
    (submitForm)="onSubmit($event)"
    ></form-admin-general>
  </ng-container>



</div>  

<!-- A practitioner or clinic who signed up as a patient (Hedieh's brief of
2026-10-22, step 6). -->
<div *ngIf="user.isU" class="bg-white mt-20p py-30p px-15p px-lg-30p rounded-8p">
  <p class="mb-15p">{{ switchCopy.cardText }}</p>
  <a routerLink="/dashboard/switch-account" class="btn btn-outline">{{ switchCopy.button }}</a>
</div>

<div 
*ngIf="isUploading"
class="modal-view"
>
  <div class="modal-drop"></div>
  <div class="modal-body" style="max-width: 250px;">
    <div class="title-container">
      <h5 class="h4-md text-center">Uploading...</h5>
    </div>
    <div class="content-container text-center mt-30p mb-10p">
      <loader></loader>
    </div>
  </div>
</div>
