name: Build and Deploy

on:
  push:
    branches: [master]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Full history, because each static page's <lastmod> in sitemap/main is
      # the date its source last changed (scripts/generate-static-page-dates.js).
      # At the default depth of 1 the one commit present looks as if it added
      # every file, so every page would be dated by the commit being deployed.
      # blob:none keeps that history to commits and trees, a few MB, instead of
      # every version of every asset (the full pack is about 345 MB).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      # Here and not in the image: the build stage has neither git nor .git.
      # The file this writes reaches the image with the rest of the working
      # tree (context: . below), and prebuild:ssr inside the image finds no git
      # and keeps these dates. --strict fails the deploy rather than ship a
      # guessed date.
      - name: Date the static pages in the sitemap
        run: node scripts/generate-static-page-dates.js --strict

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # A path, not the action's default git context: the git context
          # builds from the commit and would drop the sitemap dates the step
          # above just wrote into the working tree.
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: 167.99.178.171
          username: hedieh
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            # Reclaim the images the last few deploys left behind. Without this
            # the disk fills, the pull below fails, and the deploy silently
            # restarts the old image instead. Images in use are never removed.
            docker image prune -af || true

            docker pull ${{ env.IMAGE_NAME }}:latest
            cd ~/prompthealth-frontend
            docker compose down
            docker compose up -d
